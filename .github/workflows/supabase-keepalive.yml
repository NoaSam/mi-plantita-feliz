# Manual fallback for waking up Supabase.
#
# The recurring keepalive now lives in Vercel Cron (`api/keepalive.ts` +
# the `crons` block in vercel.json), which runs daily and is not subject to
# GitHub's rule that disables *scheduled* workflows after 60 days without
# repo activity — the reason this workflow got switched off on 22 oct 2026.
#
# The `schedule` trigger is deliberately gone: with only workflow_dispatch,
# GitHub never auto-disables this, so it stays available as a one-click
# "wake Supabase now" button from the Actions tab if the Vercel cron fails.
#
# The anon key is safe to check into git (it is the "publishable" key already
# shipped in the web bundle via .env → import.meta.env). Row-level security
# gates all reads; no data leak.

name: Supabase keepalive

on:
  # Manual trigger only — see the note above.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST endpoint
        env:
          SUPABASE_URL: https://sdxfxkqzgnonxfshbjfc.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkeGZ4a3F6Z25vbnhmc2hiamZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMzAwODEsImV4cCI6MjA5MDkwNjA4MX0.JfxZ5_d9-AEt3kkjrRq-FnDlTDwtexSCBsyUHzLcM78
        run: |
          echo "Pinging Supabase to prevent Free tier pause..."
          HTTP_CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/plant_searches?limit=1&select=id" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Response body:"
            cat /tmp/body.txt
            exit 1
          fi
          echo "OK — Supabase project is awake."
